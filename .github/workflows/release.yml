name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: decode keystore
        env:
          KEYSTORE: ${{ secrets.SYNCE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > client/android/synce-release.jks
      - name: write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.SYNCE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SYNCE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SYNCE_KEY_PASSWORD }}
        run: |
          printf 'storeFile=synce-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > client/android/key.properties
      - name: build apk
        working-directory: client
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release --build-name=${{ github.ref_name }} --build-number=${{ github.run_number }} --dart-define=SYNCE_API_URL=https://api.synce.natanim.dev
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: build windows app
        working-directory: client
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter build windows --release --dart-define=SYNCE_API_URL=https://api.synce.natanim.dev
      - name: package
        run: Compress-Archive -Path client/build/windows/x64/runner/Release/* -DestinationPath synce-windows-${{ github.ref_name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: synce-windows-*.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          mv android-apk/app-release.apk "synce-android-$TAG.apk"
          sha256sum *.apk *.zip > SHA256SUMS.txt
          gh release create "$TAG" --generate-notes --title "Synce $TAG" *.apk *.zip SHA256SUMS.txt
